name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    name: ${{ matrix.os }} - ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            c_compiler: gcc
          - os: ubuntu-latest
            compiler: clang
            c_compiler: clang
          - os: windows-latest
            compiler: msvc
            c_compiler: cl
          - os: windows-latest
            compiler: mingw
            c_compiler: gcc

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      env:
        CC: ${{ matrix.c_compiler }}
      run: |
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          cmake -B build -S . -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
        else
          cmake -B build -S .
        fi
      shell: bash

    - name: Build
      run: cmake --build build --config Release

    - name: Test (Unit & Integration)
      working-directory: ${{github.workspace}}/build
      run: ctest -C Release --output-on-failure
